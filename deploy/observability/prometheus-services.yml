global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/kafka-alerts.yml
  - /etc/prometheus/cassandra-read-alerts.yml
  - /etc/prometheus/sync-projector-alerts.yml
  - /etc/prometheus/web-sync-alerts.yml
  - /etc/prometheus/duplicate-hydration-alerts.yml
  - /etc/prometheus/service-alerts.yml

scrape_configs:
  - job_name: dipole-required
    static_configs:
      - targets: [core:9100]
        labels: {service: dipole-core}
      - targets: [message:9100]
        labels: {service: dipole-message}
      - targets: [sync:9100]
        labels: {service: dipole-sync}
      - targets: [gateway:9100]
        labels: {service: dipole-gateway}

  - job_name: dipole-optional
    static_configs:
      - targets: [search:9100]
        labels: {service: dipole-search}
      - targets: [search-indexer:9100]
        labels: {service: dipole-search-indexer}
