services:
  core:
    environment:
      # Core remains the authorization point for every retrieval capability call.
      DIPOLE_INTERNAL_RPC_AGENT_CONVERSATION_SEARCH_ENABLED: "true"

  gateway:
    environment:
      # The public route is enabled only with this opt-in candidate overlay.
      DIPOLE_GATEWAY_AGENT_RETRIEVAL_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_RETRIEVAL_TARGET: http://agent-retrieval:8091

  # Opt-in Worker for owner-reviewed cross-conversation retrieval. It has no
  # Kafka trigger, so it cannot consume the B1/B2 interactive event stream.
  agent-retrieval:
    extends:
      file: ../compose/docker-compose.microservices.yml
      service: agent
    volumes:
      - ${DIPOLE_AGENT_RELEASE_MANIFEST_FILE:?DIPOLE_AGENT_RELEASE_MANIFEST_FILE is required}:/run/dipole/release/manifest.json:ro
    environment:
      DIPOLE_AGENT_KAFKA_ENABLED: "false"
      DIPOLE_AGENT_KAFKA_CLIENT_ID: dipole-agent-retrieval
      DIPOLE_AGENT_INBOUND_INTERACTIVE_ENABLED: "false"
      DIPOLE_AGENT_INBOUND_GROUP_INTERACTIVE_ENABLED: "false"
      DIPOLE_AGENT_SUBSCRIPTION_SHADOW_ENABLED: "false"
      DIPOLE_AGENT_SUBSCRIPTION_ACTIVE_ENABLED: "false"
      DIPOLE_AGENT_TEMPORAL_ACTIVITY_MODE: retrieval_active
      DIPOLE_AGENT_TEMPORAL_TASK_QUEUE: ${DIPOLE_AGENT_RETRIEVAL_TASK_QUEUE:?DIPOLE_AGENT_RETRIEVAL_TASK_QUEUE is required}
      DIPOLE_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_AGENT_INTERACTIVE_MESSAGE_WRITE_ENABLED: "false"
      DIPOLE_AGENT_SUBSCRIPTION_MESSAGE_WRITE_ENABLED: "false"
      DIPOLE_AGENT_MEMORY_ENABLED: "false"
      DIPOLE_AGENT_RETRIEVAL_ENABLED: "true"
      DIPOLE_AGENT_RETRIEVAL_CONTEXT_ENABLED: "true"
      DIPOLE_AGENT_MCP_SERVER_ENABLED: "false"
      DIPOLE_AGENT_EXTERNAL_MCP_ENABLED: "false"
