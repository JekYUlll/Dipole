services:
  agent:
    environment:
      # Enable only owner-scoped read Tasks for the active smoke profile.
      DIPOLE_AGENT_RUNTIME_MODE: remote
      DIPOLE_AGENT_TEMPORAL_ACTIVITY_MODE: read_active
      DIPOLE_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_AGENT_MCP_SERVER_ENABLED: "false"
      DIPOLE_AGENT_EXTERNAL_MCP_ENABLED: "false"
      DIPOLE_AGENT_MEMORY_ENABLED: "false"
      DIPOLE_AGENT_RETRIEVAL_ENABLED: "false"
      DIPOLE_AGENT_RETRIEVAL_CONTEXT_ENABLED: "false"

  gateway:
    environment:
      DIPOLE_GATEWAY_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_DEFINITION_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_ARTIFACT_ENABLED: "false"
      DIPOLE_GATEWAY_AGENT_MCP_ENABLED: "false"
