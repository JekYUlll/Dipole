services:
  agent:
    volumes:
      - ${DIPOLE_AGENT_EXTERNAL_MCP_IO_MANIFEST_FILE:?DIPOLE_AGENT_EXTERNAL_MCP_IO_MANIFEST_FILE is required}:/run/dipole/external-mcp/io-manifest.json:ro
      - ${DIPOLE_AGENT_EXTERNAL_MCP_ROUTE_MANIFEST_FILE:?DIPOLE_AGENT_EXTERNAL_MCP_ROUTE_MANIFEST_FILE is required}:/run/dipole/external-mcp/routes.json:ro
      - ${DIPOLE_AGENT_EXTERNAL_MCP_SECRET_DIR:?DIPOLE_AGENT_EXTERNAL_MCP_SECRET_DIR is required}:/run/dipole/external-mcp/secrets:ro
    environment:
      DIPOLE_AGENT_RUNTIME_MODE: shadow
      DIPOLE_AGENT_KAFKA_ENABLED: "true"
      DIPOLE_AGENT_KAFKA_BROKERS: ${DIPOLE_AGENT_EXTERNAL_MCP_KAFKA_BROKERS:?DIPOLE_AGENT_EXTERNAL_MCP_KAFKA_BROKERS is required}
      DIPOLE_AGENT_KAFKA_GROUP_ID: ${DIPOLE_AGENT_EXTERNAL_MCP_KAFKA_GROUP_ID:?DIPOLE_AGENT_EXTERNAL_MCP_KAFKA_GROUP_ID is required}
      DIPOLE_AGENT_TRIGGER_MODE: subscription
      DIPOLE_AGENT_SUBSCRIPTION_SHADOW_ENABLED: "false"
      DIPOLE_AGENT_MODEL_MODE: metadata
      DIPOLE_AGENT_MEMORY_ENABLED: "false"
      DIPOLE_AGENT_CAPABILITY_RPC_ENABLED: "true"
      DIPOLE_AGENT_TEMPORAL_ENABLED: "true"
      DIPOLE_AGENT_TEMPORAL_ADDRESS: ${DIPOLE_AGENT_TEMPORAL_ADDRESS:?DIPOLE_AGENT_TEMPORAL_ADDRESS is required}
      DIPOLE_AGENT_TEMPORAL_NAMESPACE: ${DIPOLE_AGENT_TEMPORAL_NAMESPACE:?DIPOLE_AGENT_TEMPORAL_NAMESPACE is required}
      DIPOLE_AGENT_TEMPORAL_TASK_QUEUE: ${DIPOLE_AGENT_TEMPORAL_TASK_QUEUE:?DIPOLE_AGENT_TEMPORAL_TASK_QUEUE is required}
      DIPOLE_AGENT_TEMPORAL_ACTIVITY_MODE: external_mcp_shadow
      DIPOLE_AGENT_CONTROL_ENABLED: "false"
      DIPOLE_AGENT_MCP_SERVER_ENABLED: "false"
      DIPOLE_AGENT_EXTERNAL_MCP_ENABLED: "true"
      DIPOLE_AGENT_EXTERNAL_MCP_PROFILES: ${DIPOLE_AGENT_EXTERNAL_MCP_PROFILES:?DIPOLE_AGENT_EXTERNAL_MCP_PROFILES is required}
      DIPOLE_AGENT_EXTERNAL_MCP_IO_MANIFEST: /run/dipole/external-mcp/io-manifest.json
      DIPOLE_AGENT_EXTERNAL_MCP_ROUTE_MANIFEST: /run/dipole/external-mcp/routes.json
