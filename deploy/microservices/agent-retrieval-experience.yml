services:
  core:
    environment:
      # Core remains the authority for owner-scoped search requests.
      DIPOLE_INTERNAL_RPC_AGENT_CONVERSATION_SEARCH_ENABLED: "true"

  agent:
    environment:
      # This overlay is opt-in and only exposes the governed read capability.
      DIPOLE_AGENT_RETRIEVAL_ENABLED: "true"
      DIPOLE_AGENT_RETRIEVAL_CONTEXT_ENABLED: "true"
