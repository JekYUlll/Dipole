services:
  core:
    environment:
      DIPOLE_INTERNAL_RPC_AGENT_MEMORY_PROMOTION_RECEIPT_COMMIT_ENABLED: "true"

  agent:
    environment:
      DIPOLE_AGENT_TEMPORAL_ACTIVITY_MODE: promotion_active
      DIPOLE_AGENT_MEMORY_PROMOTION_COMMIT_ENABLED: "true"
      DIPOLE_AGENT_MEMORY_PROMOTION_AUTHORITY: ${DIPOLE_AGENT_MEMORY_PROMOTION_AUTHORITY:?DIPOLE_AGENT_MEMORY_PROMOTION_AUTHORITY is required and must be operator_approved}
