services:
  core:
    environment:
      # Route B/B1: hand 1v1 direct replies to the governed interactive path and
      # provision the platform low-risk promotion grant for the active candidate.
      DIPOLE_AI_DIRECT_REPLY_ENABLED: "false"
      DIPOLE_AI_AGENT_CANDIDATE_VERSION: experience-v1
      DIPOLE_FRONTEND_AGENT_ELICITATION_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_APPROVAL_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_SUBSCRIPTIONS_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_DEFINITIONS_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_MEMORIES_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_MEMORY_CORRECTION_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_TASK_CREATE_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_TIMELINE_ENABLED: "true"
      DIPOLE_FRONTEND_AGENT_ARTIFACTS_ENABLED: "true"

  gateway:
    environment:
      DIPOLE_GATEWAY_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_DEFINITION_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_SUBSCRIPTION_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_ARTIFACT_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_MEMORY_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_CONTROL_SECRET: ${DIPOLE_AGENT_CONTROL_SECRET:?DIPOLE_AGENT_CONTROL_SECRET is required}
      DIPOLE_GATEWAY_AGENT_MCP_ENABLED: "false"

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - agent_experience_temporal_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-postgresql
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 24h
      BIND_ON_IP: 0.0.0.0
    expose:
      - "7233"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/7233'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  agent:
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ../../deploy/agent/release-manifest.experience-v1.json:/run/dipole/release/manifest.json:ro
    environment:
      DIPOLE_AGENT_RUNTIME_MODE: remote
      DIPOLE_AGENT_CANDIDATE_VERSION: experience-v1
      DIPOLE_AGENT_RELEASE_MANIFEST: /run/dipole/release/manifest.json
      DIPOLE_AGENT_MODEL_MODE: ai_sdk
      DIPOLE_AGENT_MODEL_PROVIDER: openai_compatible
      DIPOLE_AGENT_MODEL_PROVIDER_NAME: ${DIPOLE_AGENT_MODEL_PROVIDER_NAME:?DIPOLE_AGENT_MODEL_PROVIDER_NAME is required}
      DIPOLE_AGENT_MODEL_BASE_URL: ${DIPOLE_AGENT_MODEL_BASE_URL:?DIPOLE_AGENT_MODEL_BASE_URL is required}
      DIPOLE_AGENT_MODEL_API_KEY: ${DIPOLE_AGENT_MODEL_API_KEY:?DIPOLE_AGENT_MODEL_API_KEY is required}
      DIPOLE_AGENT_MODEL_ROUTES: ${DIPOLE_AGENT_MODEL_ROUTES:?DIPOLE_AGENT_MODEL_ROUTES is required}
      DIPOLE_AGENT_MODEL_CONTEXT_PROFILES: ${DIPOLE_AGENT_MODEL_CONTEXT_PROFILES:?DIPOLE_AGENT_MODEL_CONTEXT_PROFILES is required}
      DIPOLE_AGENT_MODEL_STRUCTURED_OUTPUTS: ${DIPOLE_AGENT_MODEL_STRUCTURED_OUTPUTS:-false}
      DIPOLE_AGENT_MODEL_OUTPUT_MODE: ${DIPOLE_AGENT_MODEL_OUTPUT_MODE:-json_schema}
      DIPOLE_AGENT_CONTEXT_COMPILER_VERSION: v2
      # Reasoning models (e.g. deepseek-v4-flash / o1-style routes) spend a
      # non-trivial slice of the output budget on hidden reasoning tokens before
      # emitting any visible content. Experience deployments observed ~2 000
      # reasoning tokens for a single planner call, so a 1 024-token cap led to
      # empty responses and a spurious "model run budget exhausted" failure on
      # the first task. The defaults below reserve headroom for reasoning
      # tokens and leave two extra call slots for parse-retry, while still
      # honouring any explicit override the operator supplies.
      DIPOLE_AGENT_MODEL_MAX_CALLS: ${DIPOLE_AGENT_MODEL_MAX_CALLS:-3}
      # The experience stack routes interactive plans through DeepSeek with a
      # 16k output-token ceiling; complex plan prompts occasionally exceed the
      # 90s default and fail the run with budget exhausted. Default the
      # experience overlay to 180s so first-contact group @-mention and DM
      # replies succeed out of the box; operators can still tighten it.
      DIPOLE_AGENT_MODEL_TOTAL_TIMEOUT_MS: ${DIPOLE_AGENT_MODEL_TOTAL_TIMEOUT_MS:-180000}
      DIPOLE_AGENT_MODEL_MAX_OUTPUT_TOKENS: ${DIPOLE_AGENT_MODEL_MAX_OUTPUT_TOKENS:-4096}
      DIPOLE_AGENT_KAFKA_GROUP_ID: dipole-agent-active-experience-v1
      DIPOLE_AGENT_MEMORY_ENABLED: "false"
      DIPOLE_AGENT_TEMPORAL_ENABLED: "true"
      DIPOLE_AGENT_TEMPORAL_ADDRESS: temporal:7233
      DIPOLE_AGENT_TEMPORAL_NAMESPACE: default
      DIPOLE_AGENT_TEMPORAL_TASK_QUEUE: dipole-agent-interactive-experience-v1
      DIPOLE_AGENT_TEMPORAL_ACTIVITY_MODE: interactive_active
      DIPOLE_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_AGENT_CONTROL_SECRET: ${DIPOLE_AGENT_CONTROL_SECRET:?DIPOLE_AGENT_CONTROL_SECRET is required}
      DIPOLE_AGENT_INTERACTIVE_MESSAGE_WRITE_ENABLED: "true"
      # Route B/B1: admit inbound DMs to the assistant as governed interactive tasks.
      DIPOLE_AGENT_INBOUND_INTERACTIVE_ENABLED: "true"
      # Route B/B2: admit inbound group @-mentions to the assistant as governed
      # interactive tasks scoped to the group conversation.
      DIPOLE_AGENT_INBOUND_GROUP_INTERACTIVE_ENABLED: "true"
      DIPOLE_AGENT_KAFKA_GROUP_TOPIC: message.group.created
      DIPOLE_AGENT_MENTION_ALIASES: AI
      DIPOLE_AGENT_ASSISTANT_NICKNAME: ${DIPOLE_AGENT_ASSISTANT_NICKNAME:-Dipole AI}

volumes:
  agent_experience_temporal_postgresql_data:
