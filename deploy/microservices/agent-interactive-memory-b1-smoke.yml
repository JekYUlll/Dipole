services:
  core:
    environment:
      # Route B is the sole responder for this disposable inbound fixture.
      DIPOLE_AI_DIRECT_REPLY_ENABLED: "false"
      DIPOLE_AI_GROUP_REPLY_ENABLED: "false"
      # Core provisions the shared low-risk grant at startup for this exact
      # Runtime candidate. The inbound fallback must exercise that deployment
      # contract instead of relying on a hand-written grant fixture.
      DIPOLE_AI_AGENT_CANDIDATE_VERSION: ${DIPOLE_AGENT_CANDIDATE_VERSION:?DIPOLE_AGENT_CANDIDATE_VERSION is required}

  gateway:
    environment:
      # Enables the authenticated owner revoke route only in the disposable B1
      # profile so the smoke verifies the real control-plane boundary.
      DIPOLE_GATEWAY_AGENT_MEMORY_ENABLED: "true"
