services:
  agent:
    environment:
      # This overlay follows the read-shadow fallback overlay in the smoke.
      # Restore an active-only Kafka group before Runtime validates its profile.
      DIPOLE_AGENT_KAFKA_GROUP_ID: ${DIPOLE_AGENT_ACTIVE_KAFKA_GROUP_ID:?DIPOLE_AGENT_ACTIVE_KAFKA_GROUP_ID is required}
      DIPOLE_AGENT_TEMPORAL_ACTIVITY_MODE: interactive_active
      DIPOLE_AGENT_TEMPORAL_TASK_QUEUE: ${DIPOLE_AGENT_INTERACTIVE_TASK_QUEUE:?DIPOLE_AGENT_INTERACTIVE_TASK_QUEUE is required}
      DIPOLE_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_AGENT_CONTROL_SECRET: ${DIPOLE_AGENT_CONTROL_SECRET:?DIPOLE_AGENT_CONTROL_SECRET is required}
      DIPOLE_AGENT_INTERACTIVE_MESSAGE_WRITE_ENABLED: "true"

  gateway:
    environment:
      # Keep the public task API reachable only for this explicit interactive profile.
      DIPOLE_GATEWAY_AGENT_CONTROL_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_DEFINITION_ENABLED: "true"
      DIPOLE_GATEWAY_AGENT_CONTROL_SECRET: ${DIPOLE_AGENT_CONTROL_SECRET:?DIPOLE_AGENT_CONTROL_SECRET is required}
      DIPOLE_GATEWAY_AGENT_ARTIFACT_ENABLED: "false"
      DIPOLE_GATEWAY_AGENT_MCP_ENABLED: "false"
