services:
  agent:
    environment:
      DIPOLE_AGENT_MODEL_MODE: ai_sdk
      DIPOLE_AGENT_CONTEXT_COMPILER_VERSION: ${DIPOLE_AGENT_CONTEXT_COMPILER_VERSION:?set DIPOLE_AGENT_CONTEXT_COMPILER_VERSION}
      DIPOLE_AGENT_MODEL_PROVIDER: openai_compatible
      DIPOLE_AGENT_MODEL_PROVIDER_NAME: ${DIPOLE_AGENT_MODEL_PROVIDER_NAME:?set DIPOLE_AGENT_MODEL_PROVIDER_NAME}
      DIPOLE_AGENT_MODEL_BASE_URL: ${DIPOLE_AGENT_MODEL_BASE_URL:?set DIPOLE_AGENT_MODEL_BASE_URL}
      DIPOLE_AGENT_MODEL_API_KEY: ${DIPOLE_AGENT_MODEL_API_KEY:?set DIPOLE_AGENT_MODEL_API_KEY}
      DIPOLE_AGENT_MODEL_STRUCTURED_OUTPUTS: ${DIPOLE_AGENT_MODEL_STRUCTURED_OUTPUTS:-false}
      DIPOLE_AGENT_MODEL_OUTPUT_MODE: ${DIPOLE_AGENT_MODEL_OUTPUT_MODE:-json_schema}
      DIPOLE_AGENT_MODEL_ROUTES: ${DIPOLE_AGENT_MODEL_ROUTES:?set DIPOLE_AGENT_MODEL_ROUTES}
      DIPOLE_AGENT_MODEL_CONTEXT_PROFILES: ${DIPOLE_AGENT_MODEL_CONTEXT_PROFILES:?set DIPOLE_AGENT_MODEL_CONTEXT_PROFILES}
      DIPOLE_AGENT_MODEL_MAX_CALLS: ${DIPOLE_AGENT_MODEL_MAX_CALLS:?set DIPOLE_AGENT_MODEL_MAX_CALLS}
      DIPOLE_AGENT_MODEL_TOTAL_TIMEOUT_MS: ${DIPOLE_AGENT_MODEL_TOTAL_TIMEOUT_MS:?set DIPOLE_AGENT_MODEL_TOTAL_TIMEOUT_MS}
      DIPOLE_AGENT_MODEL_MAX_OUTPUT_TOKENS: ${DIPOLE_AGENT_MODEL_MAX_OUTPUT_TOKENS:?set DIPOLE_AGENT_MODEL_MAX_OUTPUT_TOKENS}
