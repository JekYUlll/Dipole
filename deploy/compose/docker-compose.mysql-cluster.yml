x-mysql: &mysql
  image: mysql:8.4.8
  restart: unless-stopped
  environment:
    MYSQL_ROOT_PASSWORD: root123
    MYSQL_ROOT_HOST: "%"
    MYSQL_DATABASE: dipole
    MYSQL_USER: dipole
    MYSQL_PASSWORD: dipole123
    TZ: Asia/Shanghai
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  mysql-1:
    <<: *mysql
    command:
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --binlog-format=ROW
      - --report-host=mysql-1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_cluster_1_data:/var/lib/mysql

  mysql-2:
    <<: *mysql
    command:
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --binlog-format=ROW
      - --report-host=mysql-2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_cluster_2_data:/var/lib/mysql

  mysql-3:
    <<: *mysql
    command:
      - --server-id=3
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --binlog-format=ROW
      - --report-host=mysql-3
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_cluster_3_data:/var/lib/mysql

  mysql-cluster-init:
    image: mysql:8.4.8
    restart: "no"
    depends_on:
      mysql-1:
        condition: service_healthy
      mysql-2:
        condition: service_healthy
      mysql-3:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - ../../deploy/mysql/init-cluster.js:/init-cluster.js:ro
      - ../../deploy/mysql/rejoin-instance.js:/rejoin-instance.js:ro
    entrypoint: ["mysqlsh", "--no-defaults", "--js", "--file", "/init-cluster.js"]

  mysql-router:
    image: container-registry.oracle.com/mysql/community-router:8.4
    restart: unless-stopped
    depends_on:
      mysql-cluster-init:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql-1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_INNODB_CLUSTER_MEMBERS: 3
      MYSQL_ROUTER_BOOTSTRAP_EXTRA_OPTIONS: --conf-base-port=6446 --disable-rw-split
    ports:
      - "127.0.0.1:16446:6446"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "6446", "-udipole", "-pdipole123"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_cluster_1_data:
  mysql_cluster_2_data:
  mysql_cluster_3_data:
