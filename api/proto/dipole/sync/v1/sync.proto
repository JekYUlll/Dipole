syntax = "proto3";

package dipole.sync.v1;

option go_package = "github.com/JekYUlll/Dipole/internal/transport/grpc/gen/sync/v1;syncv1";

import "dipole/common/v1/context.proto";
import "dipole/message/v1/message.proto";

message ListSyncMessagesRequest {
  dipole.common.v1.RequestContext context = 1;
  uint64 after_seq = 2;
  int32 page_size = 3;
}

message SyncMessage {
  uint64 sync_seq = 1;
  string conversation_key = 2;
  dipole.message.v1.Message message = 3;
  string message_uuid = 4;
  uint64 message_seq = 5;
}

message ListSyncMessagesResponse {
  repeated SyncMessage items = 1;
  uint64 next_seq = 2;
  bool has_more = 3;
}

message GetDeviceCheckpointRequest {
  dipole.common.v1.RequestContext context = 1;
}

message AdvanceDeviceCheckpointRequest {
  dipole.common.v1.RequestContext context = 1;
  uint64 sync_seq = 2;
}

message DeviceCheckpointResponse {
  string device_id = 1;
  uint64 sync_seq = 2;
}

message ListGroupCheckpointsRequest {
  dipole.common.v1.RequestContext context = 1;
  repeated string group_ids = 2;
}

message GroupCheckpoint {
  string group_id = 1;
  uint64 latest_message_sequence = 2;
  string latest_message_id = 3;
  uint64 pulled_message_sequence = 4;
}

message ListGroupCheckpointsResponse {
  repeated GroupCheckpoint checkpoints = 1;
}

message AdvanceGroupCheckpointRequest {
  dipole.common.v1.RequestContext context = 1;
  string group_id = 2;
  uint64 message_sequence = 3;
}

service SyncQueryService {
  rpc ListSyncMessages(ListSyncMessagesRequest) returns (ListSyncMessagesResponse);
  rpc GetDeviceCheckpoint(GetDeviceCheckpointRequest) returns (DeviceCheckpointResponse);
  rpc AdvanceDeviceCheckpoint(AdvanceDeviceCheckpointRequest) returns (DeviceCheckpointResponse);
  rpc ListGroupCheckpoints(ListGroupCheckpointsRequest) returns (ListGroupCheckpointsResponse);
  rpc AdvanceGroupCheckpoint(AdvanceGroupCheckpointRequest) returns (GroupCheckpoint);
}
