syntax = "proto3";

package dipole.agent.v1;

option go_package = "github.com/JekYUlll/Dipole/internal/transport/grpc/gen/agent/v1;agentv1";

import "dipole/common/v1/context.proto";

message AdmitRunRequest {
  dipole.common.v1.RequestContext context = 1;
  string tenant_id = 2;
  string principal_user_id = 3;
  string agent_id = 4;
  string trigger_type = 5;
  string trigger_ref = 6;
  string event_id = 7;
  string runtime_id = 8;
  string mode = 9;
}

message AdmitRunResponse {
  string task_id = 1;
  string run_id = 2;
  string run_status = 3;
}

message CompleteRunRequest {
  dipole.common.v1.RequestContext context = 1;
  string task_id = 2;
  string run_id = 3;
}

message CompleteRunResponse {
  string run_status = 1;
}

message ListConversationsRequest {
  dipole.common.v1.RequestContext context = 1;
  string task_id = 2;
  int32 limit = 3;
  string run_id = 4;
}

message ConversationSnapshot {
  string conversation_key = 1;
  string target_id = 2;
  int32 target_type = 3;
  string last_message_id = 4;
  uint64 last_message_seq = 5;
  string last_message_preview = 6;
  int64 last_message_at_unix_ms = 7;
  uint64 read_seq = 8;
  int32 unread_count = 9;
}

message ListConversationsResponse {
  repeated ConversationSnapshot conversations = 1;
}

service AgentCapabilityService {
  rpc AdmitRun(AdmitRunRequest) returns (AdmitRunResponse);
  rpc CompleteRun(CompleteRunRequest) returns (CompleteRunResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
}
