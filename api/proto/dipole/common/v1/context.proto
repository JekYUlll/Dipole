syntax = "proto3";

package dipole.common.v1;

option go_package = "github.com/JekYUlll/Dipole/internal/transport/grpc/gen/common/v1;commonv1";

// RequestContext is asserted by an authenticated internal caller.
// Payload fields provide audit context; transport authentication establishes trust.
message RequestContext {
  string principal_user_id = 1;
  string device_id = 2;
  string request_id = 3;
  string trace_id = 4;
  string caller_service = 5;
}
