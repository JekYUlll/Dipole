app:
  name: dipole
  env: docker

log:
  level: info
  format: console
  development: false
  file_enabled: false

server:
  host: 0.0.0.0
  port: 8080

gateway:
  # Gateway owns public HTTP/WS; non-WS HTTP is proxied to the Core HTTP process during M5.
  # embedded keeps the modular monolith path; remote gives realtime delivery ownership to cmd/gateway.
  mode: embedded
  core_http_target: http://127.0.0.1:8081

tls:
  enabled: false

metrics:
  # Bind to loopback by default. Container deployments may bind the private service network.
  enabled: false
  address: 127.0.0.1:9100

auth:
  token_ttl_hours: 168
  jwt_secret: dipole-dev-jwt-secret-change-me
  jwt_issuer: dipole

mysql:
  host: mysql
  port: 3306
  user: dipole
  password: dipole123
  dbname: dipole

redis:
  mode: single
  host: redis
  port: 6379
  password: ""
  db: 0
  sentinel_master_name: ""
  sentinel_addresses: []
  sentinel_password: ""

cassandra:
  # Shadow projector remains off until its schema and Kafka consumer are deployed independently.
  enabled: false
  hosts:
    - 127.0.0.1:19042
  keyspace: dipole_message_shadow
  local_datacenter: datacenter1
  timeline_bucket_size: 10000
  connect_timeout_seconds: 5

kafka:
  enabled: true
  brokers:
    - kafka:9092
  client_id: dipole
  topic_prefix: dipole
  topic_partitions: 6
  topic_replication_factor: 1
  topic_min_insync_replicas: 1
  topic_retention_hours: 168
  required_acks: one
  dial_timeout_seconds: 5
  write_timeout_seconds: 5
  consume_retry_max_attempts: 3
  consume_retry_backoff_ms: 500
  consumer_group_balancer: roundrobin
  consumer_heartbeat_seconds: 3
  consumer_session_timeout_seconds: 30
  consumer_rebalance_timeout_seconds: 30

message:
  # local keeps direct in-process calls; grpc connects to the authenticated Message endpoint below.
  transport: local
  # cmd/message-service: shadow serves queries only; owner enables commands, Kafka persistence, and Outbox.
  runtime_mode: owner
  # Query-only comparison; send commands always execute on the selected primary exactly once.
  shadow_queries: false
  # Compare Message Store history pages with Cassandra asynchronously; MySQL remains the response source.
  cassandra_shadow_reads: false
  # Deterministic conversation cohort for Cassandra Seq-cursor reads; 0 is the emergency rollback.
  cassandra_read_percentage: 0
  # Require a table-scoped MySQL account before accepting Message RPC traffic.
  enforce_db_permissions: false

internal_rpc:
  # Keep disabled until Core and Message are deployed as separate processes.
  enabled: false
  shared_secret: ""  # set with DIPOLE_INTERNAL_RPC_SHARED_SECRET
  core_listen_address: 127.0.0.1:9091
  core_target: 127.0.0.1:9091
  message_listen_address: 127.0.0.1:9092
  message_target: 127.0.0.1:9092
  dial_timeout_seconds: 5
  shutdown_timeout_seconds: 15
  # Plaintext is accepted only on loopback. Enable mTLS for containers or remote hosts.
  tls_enabled: false
  tls_cert_file: ""
  tls_key_file: ""
  tls_ca_file: ""
  tls_server_name: ""

storage:
  enabled: true
  provider: minio
  endpoint: minio:9000
  presign_endpoint: 192.168.1.8:9000
  access_key: dipoleminio
  secret_key: dipoleminiopass
  use_ssl: false
  bucket: dipole-files
  public_base_url: http://192.168.1.8:9000/dipole-files
  file_max_size_mb: 50
  multipart_chunk_size_mb: 5
  multipart_session_ttl_minutes: 60

rate_limit:
  enabled: false
  register_limit: 5
  register_window_seconds: 3600
  login_limit: 10
  login_window_seconds: 300
  message_limit: 120
  message_window_seconds: 60
  file_upload_limit: 10
  file_upload_window_seconds: 300

presence:
  enabled: true
  node_id: ""
  ttl_seconds: 120

hot_group:
  enabled: true
  member_count_threshold: 200
  message_threshold: 50
  window_seconds: 60
  cooling_seconds: 180

ai:
  enabled: true
  provider: openai
  model: deepseek-chat
  api_key: ""  # set via DIPOLE_AI_API_KEY in .env or environment
  base_url: "https://api.deepseek.com"
  timeout_seconds: 30
  max_context_messages: 12
  assistant_uuid: UAI000000000000000001
  assistant_nickname: Dipole AI
  assistant_telephone: "19900000000"
  assistant_email: ai@dipole.local
  assistant_avatar: https://api.dicebear.com/9.x/bottts/svg?seed=dipole-ai&backgroundColor=1a1a2e
  system_prompt: >
    You are Dipole AI, a concise and helpful instant messaging assistant.
    Use the conversation context to answer naturally.
    Output in plain text only. Do not use Markdown or HTML formatting.
    If the user sends a file, acknowledge the file metadata you can see.
    Keep answers short unless the user asks for depth.
